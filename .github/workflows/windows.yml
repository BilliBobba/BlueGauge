name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BlueGauge-Windows-x64
          path: |
            artifacts/win-x64/BlueGauge.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
